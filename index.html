<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting...</title>

  <!-- Instant Fallback Meta Refresh (Base Domain) -->
  <meta http-equiv="refresh" content="0; url=https://lancebuilds.vercel.app">

  <style>
    :root {
      --bg: #000000;
      --text: #ffffff;
      --subtext: #888888;
      --accent: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }

    .redirect-card {
      max-width: 400px;
      width: 100%;
    }

    /* Minimalist Loading Spinner */
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      border-top-color: var(--accent);
      animation: spin 0.8s linear infinite;
      margin: 0 auto 24px auto;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 500;
      margin-bottom: 8px;
      letter-spacing: -0.02em;
    }

    p {
      color: var(--subtext);
      font-size: 0.9rem;
      line-height: 1.5;
    }

    a {
      color: var(--text);
      text-decoration: underline;
      text-underline-offset: 4px;
      transition: opacity 0.2s ease;
    }

    a:hover {
      opacity: 0.7;
    }
  </style>

  <script>
    (function () {
      // Configure your target Vercel URL here (without trailing slash)
      var targetBaseUrl = "https://lancebuilds.vercel.app";

      // Preserve pathname (e.g. /about) and search params (e.g. ?ref=123)
      var newUrl = targetBaseUrl + window.location.pathname + window.location.search + window.location.hash;

      // Update manual link in DOM once loaded
      document.addEventListener("DOMContentLoaded", function () {
        var link = document.getElementById("redirect-link");
        if (link) link.href = newUrl;
      });

      // Trigger instant JS redirect
      window.location.replace(newUrl);
    })();
  </script>
</head>
<body>

  <div class="redirect-card">
    <div class="spinner" aria-hidden="true"></div>
    <h1>Taking you to the new site</h1>
    <p>If you are not redirected automatically within a few seconds, <a id="redirect-link" href="https://lancebuilds.vercel.app">click here to continue</a>.</p>
  </div>

</body>
</html>
